<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Draft &amp; Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e1e4e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 8px; color: #fff; }
    .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 14px; }
    
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #58a6ff;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .player-section { text-align: center; }
    .player-label { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .player-label.p1 { color: #f85149; }
    .player-label.p2 { color: #3fb950; }
    select {
      width: 100%;
      padding: 10px 12px;
      background: #0d1117;
      color: #e1e4e8;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    select:disabled { opacity: 0.4; cursor: not-allowed; }

    .draft-area { margin-top: 24px; }
    .draft-pick {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px;
      background: #0d1117;
      border-radius: 6px;
      border: 1px solid #21262d;
    }
    .pick-label {
      font-size: 13px;
      color: #8b949e;
      min-width: 100px;
      text-align: right;
    }
    .pick-label.current { color: #f0883e; font-weight: 600; }
    .draft-pick select { flex: 1; }
    .draft-pick .stat-preview {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #8b949e;
      min-width: 280px;
    }
    .stat-preview span { color: #e1e4e8; font-weight: 500; }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2ea043; }
    .btn-center { text-align: center; margin-top: 24px; }

    .results { margin-top: 24px; display: none; }
    .results.show { display: block; }
    .result-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
    }
    .result-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
    .result-scores {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    .team-score { font-size: 32px; font-weight: 700; }
    .team-score.p1 { color: #f85149; }
    .team-score.p2 { color: #3fb950; }
    .vs { color: #8b949e; font-size: 18px; }
    .win-bar {
      display: flex;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 12px;
    }
    .win-bar .t1 {
      background: #f85149;
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .win-bar .t2 {
      background: #3fb950;
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #8b949e;
    }
    .loading.show { display: block; }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>NBA Draft &amp; Simulator</h1>
    <p class="subtitle">Draft your dream team and simulate against a friend</p>

    <div class="panel" id="setup-panel">
      <div class="panel-title">Select Years</div>
      <div class="setup-grid">
        <div class="player-section">
          <div class="player-label p1">Player 1</div>
          <select id="year1"><option value="">Select a year...</option></select>
        </div>
        <div class="player-section">
          <div class="player-label p2">Player 2</div>
          <select id="year2"><option value="">Select a year...</option></select>
        </div>
      </div>
    </div>

    <div class="panel" id="draft-panel" style="display:none">
      <div class="panel-title">Snake Draft</div>
      <div class="draft-area" id="draft-area"></div>
      <div class="btn-center">
        <button class="btn btn-primary" id="simulate-btn" disabled>Simulate Game</button>
      </div>
    </div>

    <div class="loading" id="loading"><span class="spinner"></span>Simulating 1000 games...</div>

    <div class="results" id="results">
      <div class="result-card">
        <div class="result-title" id="result-title"></div>
        <div class="win-bar" id="win-bar"></div>
        <div class="result-scores" style="margin-top:24px">
          <div>
            <div class="team-score p1" id="score1"></div>
            <div style="color:#8b949e;font-size:13px">Avg Points</div>
          </div>
          <div class="vs">vs</div>
          <div>
            <div class="team-score p2" id="score2"></div>
            <div style="color:#8b949e;font-size:13px">Avg Points</div>
          </div>
        </div>
        <div id="roster-summary" style="display:flex;gap:80px;justify-content:center;margin-top:16px;font-size:13px;color:#8b949e"></div>
      </div>
    </div>
  </div>

  <script type="module">
    const POSITIONS = ["PG", "SG", "SF", "PF", "C"];
    let allPlayers = {};
    let years = [];
    let draftPicks = [];

    const year1 = document.getElementById("year1");
    const year2 = document.getElementById("year2");
    const draftPanel = document.getElementById("draft-panel");
    const draftArea = document.getElementById("draft-area");
    const simulateBtn = document.getElementById("simulate-btn");
    const loading = document.getElementById("loading");
    const results = document.getElementById("results");

    async function loadYears() {
      const res = await fetch("/api/years");
      years = await res.json();
      years.forEach(y => { year1.add(new Option(y, y)); year2.add(new Option(y, y)); });
    }

    async function loadPlayers(year) {
      if (allPlayers[year]) return allPlayers[year];
      const res = await fetch(`/api/players?year=${year}`);
      const data = await res.json();
      allPlayers[year] = data;
      return data;
    }

    function getDraftOrder() {
      return [
        { playerNum: 1, round: 1, position: "PG" },
        { playerNum: 2, round: 1, position: "PG" },
        { playerNum: 2, round: 2, position: "SG" },
        { playerNum: 1, round: 2, position: "SG" },
        { playerNum: 1, round: 3, position: "SF" },
        { playerNum: 2, round: 3, position: "SF" },
        { playerNum: 2, round: 4, position: "PF" },
        { playerNum: 1, round: 4, position: "PF" },
        { playerNum: 1, round: 5, position: "C" },
        { playerNum: 2, round: 5, position: "C" },
      ];
    }

    async function buildDraft() {
      const y1 = parseInt(year1.value);
      const y2 = parseInt(year2.value);
      if (!y1 || !y2) return;

      const [p1pool, p2pool] = await Promise.all([loadPlayers(y1), loadPlayers(y2)]);
      draftPicks = getDraftOrder().map((order, i) => ({
        ...order,
        index: i,
        player: null,
      }));

      draftPanel.style.display = "";
      results.classList.remove("show");
      renderDraft(p1pool, p2pool);
    }

    function renderDraft(p1pool, p2pool) {
      const usedIds = new Set();

      draftArea.innerHTML = draftPicks.map((pick, i) => {
        const pool = pick.playerNum === 1 ? p1pool : p2pool;
        const posFilter = pool.filter(p => p.position === pick.position && !usedIds.has(p.id));
        const playerLabel = pick.playerNum === 1
          ? '<span style="color:#f85149">P1</span>'
          : '<span style="color:#3fb950">P2</span>';

        const options = posFilter.map(p =>
          `<option value="${p.id}">${p.name} (${p.ppg} PPG / ${p.rpg} RPG / ${p.apg} APG / ${p.fgPct} FG% / ${p.threePct} 3P% / ${p.ftPct} FT%)</option>`
        ).join('');

        const isCurrent = draftPicks.findIndex(p => !p.player) === i;
        const labelExtra = isCurrent ? ' class="current"' : '';

        return `
          <div class="draft-pick">
            <div class="pick-label"${labelExtra}>
              ${playerLabel} ${pick.position}<br><small>Pick ${i + 1}</small>
            </div>
            <select data-pick="${i}" ${isCurrent ? '' : 'disabled'}>
              <option value="">Select ${pick.position}...</option>
              ${options}
            </select>
          </div>
        `;
      }).join('');

      draftArea.querySelectorAll('select').forEach(sel => {
        sel.addEventListener('change', () => {
          const idx = parseInt(sel.dataset.pick);
          const pool = draftPicks[idx].playerNum === 1 ? p1pool : p2pool;
          const player = pool.find(p => p.id === sel.value);
          draftPicks[idx].player = player;
          simulateBtn.disabled = draftPicks.some(p => !p.player);
          renderDraft(p1pool, p2pool);
        });
      });
    }

    async function simulate() {
      const team1Ids = draftPicks.filter(p => p.playerNum === 1).map(p => p.player.id);
      const team2Ids = draftPicks.filter(p => p.playerNum === 2).map(p => p.player.id);

      loading.classList.add("show");
      results.classList.remove("show");

      const res = await fetch("/api/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ team1: team1Ids, team2: team2Ids }),
      });
      const data = await res.json();

      loading.classList.remove("show");
      results.classList.add("show");

      const t1pct = Math.round((data.team1Wins / data.totalGames) * 100);
      const t2pct = Math.round((data.team2Wins / data.totalGames) * 100);

      document.getElementById("result-title").textContent =
        `${data.team1Wins} - ${data.team2Wins} (${data.totalGames} games)`;
      document.getElementById("win-bar").innerHTML =
        `<div class="t1" style="width:${t1pct}%">${t1pct}%</div><div class="t2" style="width:${t2pct}%">${t2pct}%</div>`;
      document.getElementById("score1").textContent = data.team1AvgScore;
      document.getElementById("score2").textContent = data.team2AvgScore;

      const t1players = draftPicks.filter(p => p.playerNum === 1);
      const t2players = draftPicks.filter(p => p.playerNum === 2);
      document.getElementById("roster-summary").innerHTML = `
        <div style="text-align:left">
          <div style="color:#f85149;font-weight:600;margin-bottom:4px">Team 1</div>
          ${t1players.map(p => `<div>${p.player.name} (${p.position})</div>`).join('')}
        </div>
        <div style="text-align:left">
          <div style="color:#3fb950;font-weight:600;margin-bottom:4px">Team 2</div>
          ${t2players.map(p => `<div>${p.player.name} (${p.position})</div>`).join('')}
        </div>
      `;
    }

    year1.addEventListener("change", buildDraft);
    year2.addEventListener("change", buildDraft);
    simulateBtn.addEventListener("click", simulate);

    loadYears();
  </script>
</body>
</html>
